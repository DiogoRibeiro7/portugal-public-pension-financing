[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "portugal-public-pension-financing"
version = "0.3.1"
description = "Reproducible research on the historical financing of Portuguese public pensions"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Diogo Ribeiro"}]
keywords = [
  "Portugal",
  "pensions",
  "public finance",
  "social security",
  "reproducible research",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26,<2.5",
  "pandas>=2.2,<3.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.11,<3.0",
  "pandas-stubs>=2.2,<3.0",
  "types-PyYAML>=6.0",
]
notebooks = [
  "jupyter>=1.0",
  "matplotlib>=3.9",
  "scipy>=1.13",
]

[project.scripts]
portugal-pensions = "portugal_pensions.cli:main"

[project.urls]
Repository = "https://github.com/DiogoRibeiro7/portugal-public-pension-financing"
Issues = "https://github.com/DiogoRibeiro7/portugal-public-pension-financing/issues"
Changelog = "https://github.com/DiogoRibeiro7/portugal-public-pension-financing/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/portugal_pensions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["portugal_pensions"]
